name: Testler

# Her PR'da ve ana dala giren her değişiklikte soru üreteçlerini ve sürüm damgalarını denetler.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
